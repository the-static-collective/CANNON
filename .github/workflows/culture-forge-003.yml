name: CULTURE-FORGE-003 native Full Measure and PENNY review
on:
  push:
    branches: ['experiment/culture-forge-003-fullmeasure-penny']
  pull_request:
    paths:
      - 'src/culture-use-003.mjs'
      - 'scripts/culture-use-003.mjs'
      - 'test/culture-use-003.test.mjs'
      - '.github/workflows/culture-forge-003.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: cannon}
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/webZ
          ref: 83b35070d8d56155156655279bfdcf50aa77794f
          path: webz
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/GrO
          ref: 9e6361105aae335ccb0657092809eef43e7ab4da
          path: gro
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/lemonPRESS
          ref: f091e73d2f64b2237ee828010ae244b39e4070b8
          path: press
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/full-measure-world-layer
          ref: c9206d5055ad574a23acb2eceb5f8785a4ad64fe
          path: full
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/Jubilee-treasury
          ref: a36777cb87bcfb6b7706b910ba18c4c4b24c73a3
          path: penny
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install Full Measure original TSX dependency
        working-directory: full
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test CANNON and exact source rules
        working-directory: cannon
        run: npm test
      - name: Test original Full Measure and PENNY native regressions
        run: |
          (cd full && node --import tsx --test tests/pledgeAuthority.test.ts tests/fullMeasure.test.ts)
          (cd penny && node --test test/penny-work-matter-014.test.mjs)
      - name: Original CANNON + WebZ + GrO + lemonPRESS
        run: |
          node cannon/scripts/culture-forge.mjs build --webz webz --gro gro --out culture-out
          node cannon/scripts/culture-delivery.mjs deliver --webz webz --gro gro --press press --forge culture-out --out press-held
      - name: Original Full Measure confirmed simulation to original PENNY empty world
        run: >
          node full/node_modules/tsx/dist/cli.mjs cannon/scripts/culture-use-003.mjs build
          --webz webz --gro gro --press press --fm full --penny penny
          --forge culture-out --held press-held --out use-confirmed --variant confirmed
      - name: Original Full Measure reported-only scenario
        run: >
          node full/node_modules/tsx/dist/cli.mjs cannon/scripts/culture-use-003.mjs build
          --webz webz --gro gro --press press --fm full --penny penny
          --forge culture-out --held press-held --out use-reported --variant reported
      - name: Cold re-execute and verify original donor contracts
        run: >
          node full/node_modules/tsx/dist/cli.mjs cannon/scripts/culture-use-003.mjs verify
          --webz webz --gro gro --press press --fm full --penny penny
          --forge culture-out --held press-held --out use-confirmed
      - name: Reject self-confirmation and unauthorized reviewer
        run: |
          if node full/node_modules/tsx/dist/cli.mjs cannon/scripts/culture-use-003.mjs build --webz webz --gro gro --press press --fm full --penny penny --forge culture-out --held press-held --out bad-self --variant self-confirmed; then exit 1; fi
          if node full/node_modules/tsx/dist/cli.mjs cannon/scripts/culture-use-003.mjs build --webz webz --gro gro --press press --fm full --penny penny --forge culture-out --held press-held --out bad-foreign --variant foreign-confirmed; then exit 1; fi
      - name: Reject changed independent review bytes
        run: |
          cp use-confirmed/review.json use-confirmed/clean.json
          printf 'FORGED' >> use-confirmed/review.json
          if node full/node_modules/tsx/dist/cli.mjs cannon/scripts/culture-use-003.mjs verify --webz webz --gro gro --press press --fm full --penny penny --forge culture-out --held press-held --out use-confirmed; then exit 1; fi
          mv use-confirmed/clean.json use-confirmed/review.json
          node full/node_modules/tsx/dist/cli.mjs cannon/scripts/culture-use-003.mjs verify --webz webz --gro gro --press press --fm full --penny penny --forge culture-out --held press-held --out use-confirmed
      - uses: actions/upload-artifact@v4
        with:
          name: culture-forge-003-actual-culture-native-human-penny-review
          path: |
            culture-out/
            press-held/
            use-confirmed/
            use-reported/
          retention-days: 30
