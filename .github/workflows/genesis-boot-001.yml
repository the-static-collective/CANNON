name: GENESIS-BOOT-001 — open-PR native A/B execution and cold replay

on:
  push:
    branches: ['experiment/genesis-boot-001-cross-branch-a-b']
  pull_request:
    paths:
      - 'src/genesis-boot.mjs'
      - 'scripts/genesis-boot.mjs'
      - 'test/genesis-boot.test.mjs'
      - 'docs/GENESIS-BOOT-001.md'
      - '.github/workflows/genesis-boot-001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-native-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cannon
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/webZ
          ref: 83b35070d8d56155156655279bfdcf50aa77794f
          path: webz
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/GrO
          ref: 9e6361105aae335ccb0657092809eef43e7ab4da
          path: gro
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/static-os
          ref: b02b5016cbd5bf2f73d758d5ed1416246b789157
          path: staticos
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/GHoT
          ref: 6f0cc9e93e2544cd2fc67a0aa43a06198825a654
          path: ghot
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/JAR-VIS
          ref: c9b8341f2eff16105f58dcd5bb9031245bcb0558
          path: jarvis
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm pinned donor checkouts are unmerged-capable exact commits
        run: |
          test "$(git -C staticos rev-parse HEAD)" = "b02b5016cbd5bf2f73d758d5ed1416246b789157"
          test "$(git -C ghot rev-parse HEAD)" = "6f0cc9e93e2544cd2fc67a0aa43a06198825a654"
          test "$(git -C gro rev-parse HEAD)" = "9e6361105aae335ccb0657092809eef43e7ab4da"
          test "$(git -C jarvis rev-parse HEAD)" = "c9b8341f2eff16105f58dcd5bb9031245bcb0558"
          test "$(git -C webz rev-parse HEAD)" = "83b35070d8d56155156655279bfdcf50aa77794f"
      - name: Run CANNON original unit tests and bounded source contract tests
        run: npm test
        working-directory: cannon
      - name: Run original STATIC OS HOUSE-SEED test suite from its open experimental PR
        run: python3 -m unittest discover -s tests -p 'test_house_seed.py' -v
        working-directory: staticos
      - name: Run original GHoT Commons Machine tests from its open experimental PR
        run: python3 -m unittest discover -s tests -p 'test_commons_machine.py' -v
        working-directory: ghot
      - name: Run original GrO MATTERCRAFT tests from its open experimental PR
        run: node --test test/mattercraft-001.test.js
        working-directory: gro
      - name: Native first boot across CANNON, WebZ, GrO, STATIC OS, GHoT and JAR;VIS
        run: |
          node cannon/scripts/genesis-boot.mjs build --staticos staticos --webz webz --gro gro --ghot ghot --jarvis jarvis --out genesis-output --question "Can one Suitcase help an ordinary house become cooperative infrastructure?"
      - name: Cold-replay all five original donor codebases and inspect generated bytes
        run: |
          node cannon/scripts/genesis-boot.mjs verify --staticos staticos --webz webz --gro gro --ghot ghot --jarvis jarvis --out genesis-output
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('genesis-output/boot-receipt.json').read_text())
          assert p['evidence']['originalSourceCodeInvoked'] is True
          assert p['evidence']['generatedHousePlans']==2
          assert p['evidence']['physicalTestsCompleted']==0
          assert p['evidence']['independentHumanStewards']==0
          assert p['evidence']['ownerCanonSelected'] is False
          assert p['evidence']['automaticActuation'] is False
          assert p['results']['A']['planSha256'] != p['results']['B']['planSha256']
          assert Path('genesis-output/first-boot.html').exists()
          assert Path('genesis-output/comic.html').exists()
          PY
      - name: Prove edited artifact and fake human outcome are refused without changing source
        run: |
          cp genesis-output/house-A.html house-A.saved
          printf 'forged' >> genesis-output/house-A.html
          if node cannon/scripts/genesis-boot.mjs verify --staticos staticos --webz webz --gro gro --ghot ghot --jarvis jarvis --out genesis-output; then
            echo "ERROR: forged output passed"; exit 1
          fi
          mv house-A.saved genesis-output/house-A.html
          node cannon/scripts/genesis-boot.mjs verify --staticos staticos --webz webz --gro gro --ghot ghot --jarvis jarvis --out genesis-output
      - name: Upload actual offline first-boot house cards, comic and source witnesses
        uses: actions/upload-artifact@v4
        with:
          name: genesis-boot-001-five-organs-two-houses
          path: genesis-output/
          retention-days: 30
