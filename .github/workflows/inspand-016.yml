name: INSPAND-016 original PlayDeck moving video to Haunted Toaster Video Pantry and Dogram
on:
  push:
    branches: [experiment/inspand-016-playdeck-toaster-video-source]
  pull_request:
    paths:
      - scripts/playdeck-toaster-native-video.mjs
      - test/playdeck-toaster-native-video.test.mjs
      - registry/playdeck-toaster-video-source-lock-v1.json
      - docs/INSPAND-016.md
      - .github/workflows/inspand-016.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-video-crossing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check source-boundary contracts before original software execution
        run: |
          node --check scripts/playdeck-toaster-native-video.mjs
          node --test test/playdeck-toaster-native-video.test.mjs test/playdeck-toaster-native-checkpoint.test.mjs
          node scripts/playdeck-toaster-native-video.mjs inspect
      - name: Fetch exact original software owners without editing native implementation
        run: |
          git clone --quiet https://github.com/the-static-collective/playdeck.git "$RUNNER_TEMP/playdeck"
          git -C "$RUNNER_TEMP/playdeck" checkout --quiet --detach a7cf718421e767fd382a01894063c3eeba3d2930
          git clone --quiet https://github.com/the-static-collective/the-haunted-toaster.git "$RUNNER_TEMP/toaster"
          git -C "$RUNNER_TEMP/toaster" checkout --quiet --detach 1e1cc119243ed5dff09be5a75efd3637222cc5ad
          (cd "$RUNNER_TEMP/playdeck" && npm install --ignore-scripts --no-package-lock --no-audit --no-fund)
          git -C "$RUNNER_TEMP/playdeck" restore --source=HEAD -- packages/ingest/src/cli.ts
          git -C "$RUNNER_TEMP/playdeck" diff --exit-code
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Original VSPantry and Dogram tests must pass separately
        run: |
          (cd "$RUNNER_TEMP/toaster/src/full-measure" && node --test tests/video-pantry.test.cjs tests/dogram-trace.test.cjs tests/dogram-sidecar-write.test.cjs)
          (cd "$RUNNER_TEMP/playdeck" && npm run receipt:genesis)
      - name: Render actual ORIGINAL PlayDeck four-second moving video and audio → original Toaster foreign-material video → Dogram
        run: |
          node scripts/playdeck-toaster-native-video.mjs build --playdeck "$RUNNER_TEMP/playdeck" --toaster "$RUNNER_TEMP/toaster" --out "$RUNNER_TEMP/native-moving" --authorize SYNTHETIC_TEST_ONLY
          node scripts/playdeck-toaster-native-video.mjs verify --playdeck "$RUNNER_TEMP/playdeck" --toaster "$RUNNER_TEMP/toaster" --out "$RUNNER_TEMP/native-moving"
          node -e 'const fs=require("fs"),p=process.argv[1],x=JSON.parse(fs.readFileSync(p+"native-video-proof.json")),r=JSON.parse(fs.readFileSync(p+"original-toaster-digested-playdeck.video-receipt.json")),d=JSON.parse(fs.readFileSync(p+"original-toaster-digested-playdeck.dogram.json"));if(x.bridge.nativeToasterReceipt!==true||x.bridge.sealedPlaydeckReceipt!==false||x.bridge.fullPlaydeckPerformance!==false||r.treatment.foreignVisualMaterial.sourceSha256!==x.originalPlaydeckExcerptSha256||r.validation.accepted!==true||d.trace.VIDEO_PROJECTION.value!==x.toasterGeneratedVideoSha256)process.exit(3)' "$RUNNER_TEMP/native-moving/"
      - name: Deliberately corrupt original video source and prove fail-closed
        run: |
          cp "$RUNNER_TEMP/native-moving/original-playdeck-excerpt.mp4" "$RUNNER_TEMP/clean-original-video.mp4"
          printf 'FAKE_MOVING_VIDEO' >> "$RUNNER_TEMP/native-moving/original-playdeck-excerpt.mp4"
          if node scripts/playdeck-toaster-native-video.mjs verify --playdeck "$RUNNER_TEMP/playdeck" --toaster "$RUNNER_TEMP/toaster" --out "$RUNNER_TEMP/native-moving";then echo "FORGED_VIDEO_ACCEPTED";exit 1;fi
          cp "$RUNNER_TEMP/clean-original-video.mp4" "$RUNNER_TEMP/native-moving/original-playdeck-excerpt.mp4"
          node scripts/playdeck-toaster-native-video.mjs verify --playdeck "$RUNNER_TEMP/playdeck" --toaster "$RUNNER_TEMP/toaster" --out "$RUNNER_TEMP/native-moving"
      - uses: actions/upload-artifact@v4
        with:
          name: inspand-016-genuine-playdeck-motion-into-original-toaster-foreign-material
          path: ${{ runner.temp }}/native-moving/
          retention-days: 14
          if-no-files-found: error
