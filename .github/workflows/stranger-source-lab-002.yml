name: STRANGER SOURCE LAB 002 — contract, syntax and fail-closed test
on:
  push:
    branches: ['experiment/constellation-002-stranger-arcade']
    paths:
      - 'scripts/stranger-source-lab.mjs'
      - 'test/stranger-source-lab.test.mjs'
      - 'docs/STRANGER-ARCADE-002.md'
      - '.github/workflows/stranger-source-lab-002.yml'
  pull_request:
    paths:
      - 'scripts/stranger-source-lab.mjs'
      - 'test/stranger-source-lab.test.mjs'
      - 'docs/STRANGER-ARCADE-002.md'
      - '.github/workflows/stranger-source-lab-002.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Ensure module parses
        run: node --check scripts/stranger-source-lab.mjs
      - name: Fail-closed atlas and source selection tests
        run: node --test test/stranger-source-lab.test.mjs
      - name: Confirm no source-acquisition or native-execution claim
        run: |
          node --input-type=module -e '
            import {eligible} from "./scripts/stranger-source-lab.mjs";
            import {readFileSync} from "node:fs";
            const a=JSON.parse(readFileSync("constellation/atlas.json","utf8"));
            const n=eligible(a).length;
            if(n<50) process.exit(1);
            console.log(n+" pinned README research candidates (not executed)");
          '
