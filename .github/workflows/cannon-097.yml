name: 'CANNON-097 — Independent Hidden Common Source Inference Reviewer'
on:
  push:
    branches:
      - experiment/cannon-097-hidden-origin-inference-review
  pull_request:
    paths:
      - 'experiments/cannon-097/**'
      - '.github/workflows/cannon-097.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-evidence-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Original exact MOTIF-012 owner code
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/MOTIF
          ref: cd4884af4cb456aeab07f8f5738d1df0f6d3c852
          path: motif-source
          persist-credentials: false
      - name: Original GRAFT-030 source-owning compiled visual grammar
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/GRAFT
          ref: 0347c492c5e517788c0cbd87ee6f57aef3ce2a81
          path: graft-source
          persist-credentials: false
      - name: Original CANNON-095 source-owning visual program reviewer
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/CANNON
          ref: 3f2210ba6272a9538843d093edb64d1b29d2f294
          path: cannon-095-source
          persist-credentials: false
      - name: Original MOTIF-006 source-owning raw PNG reader
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/MOTIF
          ref: 6abd24ad0cb04434b22a07f56b28c638a1bdd146
          path: motif-image-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original MOTIF-007 generates source-labeled actual PNG input
        run: |
          python motif-source/experiments/door-foundry-007/text_to_visual.py \
            --text "A red crate starts left of a blue wall. Move it to the right of the wall." \
            --out text-scenes
          python motif-source/experiments/door-foundry-007/text_to_visual.py \
            --text "A red crate is beside a blue wall. Move it to the other side." \
            --out ambiguous-scenes
      - name: Original GRAFT-030 real new visual operator tests
        run: node --test graft-source/test/visual-grammar-030.test.mjs
      - name: Independently replay original CANNON-095 code before source-root review
        run: |
          mkdir -p evidence
          node cannon-095-source/experiments/cannon-095/review.mjs \
            --graft graft-source --motif motif-image-source \
            --start text-scenes/H01/start.png --goal text-scenes/H01/target.png \
            --gap text-scenes/H01/visual-gap.json \
            --out evidence/cannon-095-original-visual-review.json
      - name: Original MOTIF-006 assembles true GRAFT-generated executable
        run: |
          python motif-source/experiments/door-foundry-006/build.py \
            --start text-scenes/H01/start.png \
            --goal text-scenes/H01/target.png \
            --gap text-scenes/H01/visual-gap.json \
            --receipt evidence/cannon-095-original-visual-review.json \
            --graft graft-source --out generated-visual-motif
          python generated-visual-motif/run.py --out imagined-futures \
            > evidence/imagined-result.json
      - name: Original MOTIF-009 creates four source-owned PNG worlds
        run: |
          python motif-source/experiments/door-foundry-009/visual_question.py \
            --ambiguous ambiguous-scenes --base text-scenes \
            --imagined imagined-futures --build generated-visual-motif \
            --out original-question > evidence/question-output.json
      - name: Original MOTIF-012 creates five synthetic origin and independent-coincidence scenarios
        run: |
          python motif-source/experiments/door-foundry-012/hidden_source.py \
            --question-dir original-question \
            --out hidden-source-results > evidence/hidden-source-owner-summary.json
      - name: CANNON-097 independently replays latent source Bayes and unsent question costs
        env:
          MOTIF012_SOURCE: ${{ github.workspace }}/motif-source
          MOTIF009_QUESTION_DIR: ${{ github.workspace }}/original-question
          MOTIF012_HIDDEN_DIR: ${{ github.workspace }}/hidden-source-results
        run: node --test experiments/cannon-097/test-review.mjs
      - name: Issue unsigned held rational latent-source audit after independent tests
        run: |
          node experiments/cannon-097/review.mjs \
            --motif motif-source --question original-question \
            --hidden hidden-source-results \
            --out evidence/cannon-097-review.json
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync('evidence/cannon-097-review.json','utf8'));
          if(p.status!=='HOLD_LATENT_ORIGIN_MATH_REPLAYED_WITNESSES_UNAUTHENTICATED' ||
             p.five_finite_synthetic_cases.length!==5 ||
             p.actual_human_evidence_authenticated!==false ||
             p.external_source_independence_demonstrated!==false ||
             p.people_contacted!==0 || p.code_admitted!==false)
            throw Error('Independent source-origin review produced unsupported claims');
          console.log(JSON.stringify({held:p.status,
            original_motif_commit:p.original_source_owner.commit,
            mathematical_scenarios_checked:p.five_finite_synthetic_cases.length,
            actual_human_attestations:0},null,2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: CANNON-097-HIDDEN-SOURCE-ORIGINS-UNAUTHENTICATED-HOLD
          path: |
            evidence/
            original-question/
            hidden-source-results/
          retention-days: 30
          if-no-files-found: error
