name: INSPAND-014 PlayDeck to Haunted Toaster RED-first original contract experiment
on:
  push:
    branches: [experiment/inspand-014-playdeck-toaster-red-gate]
  pull_request:
    paths:
      - scripts/playdeck-toaster-red-gate.mjs
      - test/playdeck-toaster-red-gate.test.mjs
      - registry/playdeck-toaster-red-lock-v1.json
      - docs/INSPAND-014.md
      - .github/workflows/inspand-014.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: New CANNON spec and held-refusal gates
        run: |
          node --check scripts/playdeck-toaster-red-gate.mjs
          node --test test/playdeck-toaster-red-gate.test.mjs test/multi-repo-question-field.test.mjs
          node scripts/playdeck-toaster-red-gate.mjs inspect
      - name: Fetch exact original PlayDeck, Haunted Toaster and National Treasure source owners
        run: |
          mkdir -p "$RUNNER_TEMP/red-owners"
          git clone --quiet https://github.com/the-static-collective/playdeck.git "$RUNNER_TEMP/red-owners/playdeck"
          git -C "$RUNNER_TEMP/red-owners/playdeck" checkout --quiet --detach a7cf718421e767fd382a01894063c3eeba3d2930
          git clone --quiet https://github.com/the-static-collective/the-haunted-toaster.git "$RUNNER_TEMP/red-owners/toaster"
          git -C "$RUNNER_TEMP/red-owners/toaster" checkout --quiet --detach 3652c2a96b6b287cda316d1c92daadf7c7417eaf
          git clone --quiet https://github.com/the-static-collective/national-treasure.git "$RUNNER_TEMP/red-owners/national-treasure"
          git -C "$RUNNER_TEMP/red-owners/national-treasure" checkout --quiet --detach d6ff149a7a2d59dcb41c2c61606204b20b56a2fa
          (cd "$RUNNER_TEMP/red-owners/playdeck" && npm install --ignore-scripts --no-package-lock --no-audit --no-fund)
      - name: Original source owners prove their own receipt contracts
        run: |
          (cd "$RUNNER_TEMP/red-owners/playdeck" && npm run receipt:genesis)
          (cd "$RUNNER_TEMP/red-owners/toaster/src/full-measure" && node --test tests/dogram-trace.test.cjs)
          (cd "$RUNNER_TEMP/red-owners/national-treasure" && node tools/question-box/test.mjs)
      - name: Real original Haunted Toaster Dogram validator must RED-reject raw PlayDeck receipt
        run: |
          if node scripts/playdeck-toaster-red-gate.mjs red --playdeck "$RUNNER_TEMP/red-owners/playdeck" --toaster "$RUNNER_TEMP/red-owners/toaster" > "$RUNNER_TEMP/red-owners/expected-red.log" 2>&1; then
            echo "FAIL: original Toaster accepted foreign receipt as genuine video";
            exit 1;
          fi
          cat "$RUNNER_TEMP/red-owners/expected-red.log"
          grep -q EXPECTED_RED_ORIGINAL_TOASTER_REJECTS_PLAYDECK_PERFORMANCE_RECEIPT "$RUNNER_TEMP/red-owners/expected-red.log"
      - name: Green held adapter specification bound to original receipts and National Treasure question
        run: |
          node scripts/playdeck-toaster-red-gate.mjs build --playdeck "$RUNNER_TEMP/red-owners/playdeck" --toaster "$RUNNER_TEMP/red-owners/toaster" --treasure "$RUNNER_TEMP/red-owners/national-treasure" --out "$RUNNER_TEMP/red-owners/handoff-spec" --authorize SYNTHETIC_TEST_ONLY
          node scripts/playdeck-toaster-red-gate.mjs verify --playdeck "$RUNNER_TEMP/red-owners/playdeck" --toaster "$RUNNER_TEMP/red-owners/toaster" --treasure "$RUNNER_TEMP/red-owners/national-treasure" --out "$RUNNER_TEMP/red-owners/handoff-spec"
          node -e 'const fs=require("fs"),p=process.argv[1],e=JSON.parse(fs.readFileSync(p+"test-receipt.json")),s=JSON.parse(fs.readFileSync(p+"interface-spec.json")),q=JSON.parse(fs.readFileSync(p+"next-question.json"));if(e.directCastRejected!==true||e.schemaRenameRejected!==true||e.adapterStatus!=="HOLD_NOT_CONNECTED"||s.bridgeImplemented!==false||s.producerPhase!=="projected"||q.originalQuestion.aperture.id!=="source-object")process.exit(3)' "$RUNNER_TEMP/red-owners/handoff-spec/"
      - name: Forged source receipts and altered original Toaster code are refused
        run: |
          cp "$RUNNER_TEMP/red-owners/handoff-spec/playdeck-projected-receipt.json" "$RUNNER_TEMP/red-owners/genuine-playdeck.json"
          printf 'CLAIMED_RENDERED' >> "$RUNNER_TEMP/red-owners/handoff-spec/playdeck-projected-receipt.json"
          if node scripts/playdeck-toaster-red-gate.mjs verify --playdeck "$RUNNER_TEMP/red-owners/playdeck" --toaster "$RUNNER_TEMP/red-owners/toaster" --treasure "$RUNNER_TEMP/red-owners/national-treasure" --out "$RUNNER_TEMP/red-owners/handoff-spec"; then echo 'FORGED_RECEIPT_ACCEPTED';exit 1;fi
          cp "$RUNNER_TEMP/red-owners/genuine-playdeck.json" "$RUNNER_TEMP/red-owners/handoff-spec/playdeck-projected-receipt.json"
          printf '\n// FAKE_GENUINE_RECEIPT' >> "$RUNNER_TEMP/red-owners/toaster/src/full-measure/src/render/dogram-trace.cjs"
          if node scripts/playdeck-toaster-red-gate.mjs verify --playdeck "$RUNNER_TEMP/red-owners/playdeck" --toaster "$RUNNER_TEMP/red-owners/toaster" --treasure "$RUNNER_TEMP/red-owners/national-treasure" --out "$RUNNER_TEMP/red-owners/handoff-spec"; then echo 'MUTATED_OWNER_ACCEPTED';exit 1;fi
          git -C "$RUNNER_TEMP/red-owners/toaster" restore src/full-measure/src/render/dogram-trace.cjs
          node scripts/playdeck-toaster-red-gate.mjs verify --playdeck "$RUNNER_TEMP/red-owners/playdeck" --toaster "$RUNNER_TEMP/red-owners/toaster" --treasure "$RUNNER_TEMP/red-owners/national-treasure" --out "$RUNNER_TEMP/red-owners/handoff-spec"
      - uses: actions/upload-artifact@v4
        with:
          name: inspand-014-playdeck-toaster-actual-source-RED-test-and-held-adapter-requirements
          path: |
            ${{ runner.temp }}/red-owners/handoff-spec/
            ${{ runner.temp }}/red-owners/expected-red.log
          retention-days: 30
          if-no-files-found: error
